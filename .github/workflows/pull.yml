name: Pull league data

on:
  schedule:
    - cron: "7 * * * *"              # every hour
    - cron: "22,37,52 13-18 * * 0"   # Sunday mornings US Eastern: every 15 minutes until kickoff
  workflow_dispatch:                 # "refresh now" button

permissions:
  contents: write

concurrency:
  group: pull-league
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Pull from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ -z "$ESPN_S2" ] || [ -z "$ESPN_SWID" ]; then
            echo "::warning::ESPN cookies are not set yet (repo secrets ESPN_S2 and ESPN_SWID). Skipping."
            exit 0
          fi
          python pull_league.py
      - name: Save snapshot to the repo
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          [ -d data ] || exit 0
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Update league data"
          git pull -q --rebase
          git push -q
      - name: Build the locked copy for the phone
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          # Only the page and an encrypted copy of the data go in site/. Nothing readable without the password.
          if [ -z "$DASHBOARD_PASSWORD" ] || [ ! -f data/league.json ]; then exit 0; fi
          mkdir -p site
          cp dashboard.html site/index.html
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -salt -pass env:DASHBOARD_PASSWORD -in data/league.json -out site/league.enc
      - name: Publish the locked copy
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          # Goes to the separate todds-front-office repo as a single commit, so its history never grows.
          if [ ! -d site ] || [ -z "$SITE_DEPLOY_KEY" ]; then exit 0; fi
          mkdir -p ~/.ssh
          echo "$SITE_DEPLOY_KEY" > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd site
          touch .nojekyll
          git init -q -b main
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Update"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o IdentitiesOnly=yes" git push -q -f git@github.com:sKenny95/todds-front-office.git main
