name: Pull league data

on:
  schedule:
    - cron: "7 * * * *"              # every hour
    - cron: "22,37,52 13-18 * * 0"   # Sunday mornings US Eastern: every 15 minutes until kickoff
  workflow_dispatch:                 # "refresh now" button

permissions:
  contents: write

concurrency:
  group: pull-league
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Pull from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ -z "$ESPN_S2" ] || [ -z "$ESPN_SWID" ]; then
            echo "::warning::ESPN cookies are not set yet (repo secrets ESPN_S2 and ESPN_SWID). Skipping."
            exit 0
          fi
          python pull_league.py
      - name: Save snapshot to the repo
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          [ -d data ] || exit 0
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Update league data"
          git pull -q --rebase
          git push -q
